<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard – SwarnaVeda</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-nav{background:linear-gradient(90deg,rgba(0,0,0,0.7),rgba(0,0,0,0.5));padding:12px 24px;display:flex;gap:16px;margin-bottom:24px;border-radius:8px;}
    .admin-nav button{background:transparent;border:1px solid rgba(255,215,0,0.3);color:var(--white);padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;transition:all .2s;}
    .admin-nav button.active{border-color:var(--gold-start);background:rgba(255,215,0,0.1);}
    .admin-nav button:hover{border-color:var(--gold-start);background:rgba(255,215,0,0.15);}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;margin-bottom:6px;color:rgba(255,255,255,0.8);font-weight:500;font-size:13px;}
    .form-group input, .form-group textarea, .form-group select{width:100%;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.2);border-radius:6px;color:var(--white);font-family:inherit;}
    .form-group textarea{resize:vertical;min-height:80px;}
    .table-container{overflow-x:auto;}
    .product-table{width:100%;border-collapse:collapse;margin-top:12px;}
    .product-table th{background:rgba(255,215,0,0.1);padding:12px;text-align:left;color:var(--gold-start);font-weight:600;border-bottom:1px solid rgba(255,215,0,0.2);}
    .product-table td{padding:12px;border-bottom:1px solid rgba(255,215,0,0.1);}
    .product-table tr:hover{background:rgba(255,215,0,0.05);}
    .action-btn{background:linear-gradient(90deg,var(--gold-start),var(--gold-end));border:0;color:#000;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;font-size:12px;margin-right:6px;transition:all .2s;}
    .action-btn:hover{transform:scale(1.05);}
    .delete-btn{background:rgba(255,100,100,0.9);}
    .delete-btn:hover{background:rgba(255,100,100,1);}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="/" class="logo" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;">
        <img src="/images/logo.png" alt="SwarnaVeda logo" class="site-logo" width="40" height="40" />
        <span class="brand">SwarnaVeda</span>
      </a>
    </div>
    <div class="nav-right">
      <a href="/profile.html" class="btn login" style="font-size:13px;">Profile</a>
      <a href="/login.html" class="btn login" id="nav-login" style="font-size:13px;">Logout</a>
    </div>
  </nav>

  <main class="container" style="padding-top:40px;max-width:1200px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h2 style="margin:0;color:var(--gold-start);">Admin Dashboard</h2>
      <p style="color:rgba(255,255,255,0.7);margin:0;" id="user-info">Admin</p>
    </div>

    <div class="admin-nav">
      <button class="tab-btn active" data-tab="products">Products Inventory</button>
      <button class="tab-btn" data-tab="add-product">Add New Product</button>
    </div>

    <!-- Products Inventory Tab -->
    <div id="products-tab" class="tab-content">
      <div style="background:var(--card);border-radius:12px;padding:24px;">
        <h3 style="margin-top:0;color:var(--gold-start);">Manage Products</h3>
        <div style="margin-bottom:16px;">
          <input type="search" id="search-products" placeholder="Search products..." style="width:100%;max-width:300px;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.2);border-radius:6px;color:var(--white);" />
        </div>
        <div class="table-container">
          <table class="product-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-list"></tbody>
          </table>
        </div>
        <p id="products-msg" style="color:rgba(255,255,255,0.8);text-align:center;margin-top:16px;"></p>
      </div>
    </div>

    <!-- Add Product Tab -->
    <div id="add-product-tab" class="tab-content" style="display:none;">
      <div style="background:var(--card);border-radius:12px;padding:24px;max-width:600px;">
        <h3 style="margin-top:0;color:var(--gold-start);">Add New Product</h3>
        <form id="add-product-form">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="product-name" required />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-group">
              <label>Price (₹) *</label>
              <input type="number" id="product-price" min="0" required />
            </div>
            <div class="form-group">
              <label>Category *</label>
              <select id="product-category" required>
                <option value="">Select category</option>
                <option value="Ring">Ring</option>
                <option value="Necklace">Necklace</option>
                <option value="Earrings">Earrings</option>
                <option value="Bracelet">Bracelet</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Product Image</label>
            <input type="file" id="product-image" accept="image/*" />
            <small style="color:rgba(255,255,255,0.5);">Recommended: 400x400px JPG/PNG</small>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="product-description" placeholder="Product details..."></textarea>
          </div>
          <button type="submit" class="btn login" style="width:100%;margin-top:12px;">Add Product</button>
        </form>
        <p id="add-msg" style="color:rgba(255,255,255,0.8);text-align:center;margin-top:16px;"></p>
      </div>
    </div>
  </main>

  <script src="js/admin-dashboard.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navLogin = document.getElementById('nav-login');
      const getToken = () => localStorage.getItem('sv_token');
      const isLoggedIn = () => !!getToken();
      const updateNav = () => {
        navLogin.textContent = isLoggedIn() ? 'Logout' : 'Login';
      };
      updateNav();
      navLogin.addEventListener('click', () => {
        if (isLoggedIn()) {
          localStorage.removeItem('sv_token');
          updateNav();
          window.location.href = '/';
        } else {
          window.location.href = '/login.html';
        }
      });
    });
  </script>
</body>
</html>
